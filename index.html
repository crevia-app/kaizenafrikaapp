        #root-shell img{width:48px;height:48px;border-radius:14px;background:#09090b;animation:pulse 1.6s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.92)}}
      </style>
      <div id="root-shell">
        <img src="/kaizen-logo.png" alt="Loading Kaizen Afrika…" />
